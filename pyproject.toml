[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "harnesshop"
version = "0.1.1"
description = "Move coding-agent sessions between Codex, Hermes, and other ATIF-compatible harnesses."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Valdemar-Yu" }]
keywords = ["ai-agents", "codex", "hermes-agent", "atif", "session-migration"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "atif>=1.7,<2",
  "pydantic>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.9",
]

[project.scripts]
harnesshop = "harnesshop.cli:main"

[project.urls]
Homepage = "https://github.com/Valdemar-Yu/harnesshop"
Repository = "https://github.com/Valdemar-Yu/harnesshop"
Issues = "https://github.com/Valdemar-Yu/harnesshop/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/harnesshop"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
